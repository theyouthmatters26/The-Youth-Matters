# Local development services. Production uses DigitalOcean Managed PostgreSQL + Redis.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tym
      POSTGRES_PASSWORD: tym
      POSTGRES_DB: tym
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
