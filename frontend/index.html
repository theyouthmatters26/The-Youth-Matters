<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Youth Matters: ask questions, meet students and talk to verified mentors before you study abroad." />
    <meta name="keywords" content="study abroad, study abroad community, study abroad mentors, student visa guidance, UK student visa, USA student visa, Canada student visa, Australia student visa, Germany student visa, Ireland student visa, statement of purpose help, SOP review, university selection, scholarship guidance, IELTS, TOEFL, student accommodation abroad, international students, study abroad counselling, study abroad consultant alternative, masters abroad, bachelors abroad, study abroad forum, study abroad chat room, visa financial requirements, CAS letter, student life abroad, part time jobs for international students, study abroad from India, mentorship for students" />
    <meta name="author" content="The Youth Matters" />

    <!-- Google wants a square icon that is a multiple of 48 pixels and lives at the same address
         over time, so the logo is served here already squared rather than cropped by the browser -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <!-- iOS reads this one and nothing else, and it fills transparency with black, so it is drawn
         on the background colour at the size iOS asks for (frontend/scripts/icons.py) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="theme-color" content="#404043" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta property="og:site_name" content="The Youth Matters" />
    <meta property="og:locale" content="en_GB" />
    <title>The Youth Matters | Study abroad community</title>
  </head>
  <!-- Spell check for everything members type. Browsers skip password and email fields on their
       own, and it is inherited, so each box does not have to ask for it. -->
  <body spellcheck="true">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
