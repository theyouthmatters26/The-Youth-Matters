# The Youth Matters behind Nginx. Copy to /etc/nginx/sites-available/, set the domain, the certificate
# paths and the folder, then reload Nginx.
#
# The API (Gunicorn) listens on 127.0.0.1:8000 only; everything from outside comes through here.

server {
    listen 80;
    server_name theyouthmatters.com www.theyouthmatters.com;
    return 301 https://theyouthmatters.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name theyouthmatters.com;

    ssl_certificate     /etc/letsencrypt/live/theyouthmatters.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theyouthmatters.com/privkey.pem;

    root /var/www/tym/frontend/dist;

    # Text is sent compressed: pages, scripts, styles and the API's JSON
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Files with a fingerprint in the name never change: browsers may keep them for a year
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Photographs and the logo: a month
    location ~* \.(avif|jpg|jpeg|png|webp|ico|woff2)$ {
        expires 30d;
        try_files $uri =404;
    }

    # The API. X-Forwarded-For carries the visitor's address, which the rate limits count by
    # (TRUSTED_PROXIES=1 in .env says one proxy, this one, is in front).
    # ^~ so the picture rule above never takes these: members' uploads are /api/media/....jpeg and come
    # from the API, not from a file in dist/.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;   # photo ID and picture uploads
        proxy_read_timeout 90s;     # an answer from TYM AI can take a while
    }

    # The empty app shell. Reached only through the rules below, never as an address of its own,
    # so it cannot be indexed as a page in its own right.
    location = /app.html {
        internal;
        expires -1;
    }

    # Pages the app draws in the browser from an identifier in the address: a country, a question,
    # a member, a mentor, an article. There is no file for these, so they answer with the shell.
    location ~ ^/(?:c|p|u|blogs|mentors|chat)/ {
        expires -1;
        try_files $uri $uri/index.html /app.html;
    }

    # Pages only a signed in member sees, which are never built ahead of time
    location ~ ^/(?:ask|search|notifications|my|settings|ai|chat|admin|forgot-password)(?:/|$) {
        expires -1;
        try_files $uri $uri/index.html /app.html;
    }

    # Everything else: the page built ahead of time (dist/about/index.html for /about), or a real
    # 404. An address we do not have must never answer 200 with the app shell. That is what let
    # injected spam addresses such as /index.php/elf+slot look like real pages to Google, and it is
    # why Search Console filled up with pages that were crawled and then not indexed.
    location / {
        expires -1;   # always check for a newer page
        try_files $uri $uri/index.html =404;
        # Our own 404 page rather than the Nginx one. The status stays 404, which is the part that
        # matters: the address is dropped instead of being kept as a thin duplicate.
        error_page 404 /app.html;
    }
}
