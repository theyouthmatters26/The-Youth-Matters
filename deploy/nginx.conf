# The Youth Matters behind Nginx. Copy to /etc/nginx/sites-available/, set the domain, the certificate
# paths and the folder, then reload Nginx.
#
# The API (Gunicorn) listens on 127.0.0.1:8000 only; everything from outside comes through here.

server {
    listen 80;
    server_name theyouthmatters.com www.theyouthmatters.com;
    return 301 https://theyouthmatters.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name theyouthmatters.com;

    ssl_certificate     /etc/letsencrypt/live/theyouthmatters.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theyouthmatters.com/privkey.pem;

    root /var/www/tym/frontend/dist;

    # Text is sent compressed: pages, scripts, styles and the API's JSON
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Files with a fingerprint in the name never change: browsers may keep them for a year
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Photographs and the logo: a month
    location ~* \.(avif|jpg|jpeg|png|webp|ico|woff2)$ {
        expires 30d;
        try_files $uri =404;
    }

    # The API. X-Forwarded-For carries the visitor's address, which the rate limits count by
    # (TRUSTED_PROXIES=1 in .env says one proxy, this one, is in front).
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;   # photo ID and picture uploads
        proxy_read_timeout 90s;     # an answer from TYM AI can take a while
    }

    # Pages: the one built ahead of time if there is one (dist/about/index.html for /about),
    # otherwise the app itself, which draws the page in the browser
    location / {
        expires -1;   # always check for a newer page
        try_files $uri $uri/index.html /app.html;
    }
}
